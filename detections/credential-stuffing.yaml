id: credential_stuffing
name: Credential stuffing burst
severity: high
mitre: T1110.004  # Brute Force: Credential Stuffing

rationale: >
  Credential stuffing shows up as a high volume of POSTs to a single
  authentication path from one source, or from many sources sharing one user
  agent. The per-IP shape is caught by the rate limit rule; this detection
  exists for the distributed case the rate limit misses, where each individual
  address stays under the limit.

query: |
  fields @timestamp, httpRequest.clientIp as ip, httpRequest.uri as uri
  | filter httpRequest.httpMethod = "POST"
  | filter uri like /\/(login|signin|auth|token)/
  | stats count(*) as attempts, count_distinct(ip) as sources by bin(5m)
  | filter attempts > 100 and sources > 20

metric_filter_pattern: '{ $.httpRequest.httpMethod = "POST" }'

threshold:
  attempts: 100
  distinct_sources: 20
  window: 5m

tuning_notes: >
  TODO - measure. The distributed-source condition matters: without it this
  fires on any busy login page. With it, the signal is "many addresses behaving
  identically", which is much harder to produce legitimately.

false_positives:
  - A genuine traffic spike after a marketing send.
  - Corporate NAT, where many real users share few addresses -- note this
    INVERTS the signal, so a low distinct_sources count is not exonerating.

response: >
  Page. Do not auto-block: a distributed campaign plus auto-blocking is a
  self-inflicted denial of service on real users behind shared addresses.
