[project]
name = "wafops"
version = "0.1.0"
description = "Test and operate the WAF Ops Platform. Terraform owns what IS; this owns what HAPPENS."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.32",
    "pyyaml>=6.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "responses>=0.25"]

[project.scripts]
wafops = "wafops.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wafops = ["payloads/*.yaml"]

[tool.ruff]
line-length = 100

# B008 (function call in argument defaults) is Typer's documented pattern:
# typer.Option() in defaults is the framework's interface, not a bug.
[tool.ruff.lint.per-file-ignores]
"src/wafops/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
